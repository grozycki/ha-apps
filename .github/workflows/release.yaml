---
# Release one app: set its version, close the Unreleased section of its
# CHANGELOG, commit, tag APP-vVERSION and run publish.yaml for that tag.
#
# Commits that are not released never reach users: the distribution
# repository changes only in publish.yaml.
name: Release app

on:
  workflow_dispatch:
    inputs:
      app:
        description: App directory (slug), e.g. mcp_adb
        required: true
        type: string
      version:
        description: New version, e.g. 1.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.app }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main, not ${GITHUB_REF}"
          exit 1

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check the request
        id: tag
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${APP}" =~ ^[a-z0-9_]+$ || ! -f "${APP}/config.yaml" ]]; then
            echo "::error::${APP} is not an app directory"
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${VERSION} is not a version like 1.2.0"
            exit 1
          fi
          current="$(yq -r '.version' "${APP}/config.yaml")"
          highest="$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -n1)"
          if [[ "${VERSION}" == "${current}" || "${highest}" != "${VERSION}" ]]; then
            echo "::error::${VERSION} must be higher than the current ${current}"
            exit 1
          fi
          tag="${APP}-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set the version and close the changelog section
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/changelog.py release "${APP}/CHANGELOG.md" "${VERSION}" "$(date -u +%Y-%m-%d)"
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" "${APP}/config.yaml"
          git diff

      - name: Commit, tag and push
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${APP} ${VERSION}"
          git tag -a "${TAG}" -m "${APP} ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

  publish:
    name: Publish
    needs: prepare
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
