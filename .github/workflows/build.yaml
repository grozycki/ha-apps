---
# Test builds of the apps a pull request or push changes. Nothing is pushed:
# images are published only by publish.yaml, for a release tag.
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed apps
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          apps="$(scripts/changed-apps.sh "${BASE}" "${HEAD}")"
          echo "Changed apps: ${apps}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: false
