---
# Build one app for all its architectures. With publish, push the images and
# the multi-arch manifest, and refuse to overwrite an existing version tag.
name: Build app

on:
  workflow_call:
    inputs:
      app:
        description: App directory (slug)
        required: true
        type: string
      publish:
        description: Push images and the manifest
        required: true
        type: boolean
      ref:
        description: Git ref to build (defaults to the triggering ref)
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  prepare:
    name: Prepare ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.info.outputs.image_name }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read app information
        id: info
        env:
          APP: ${{ inputs.app }}
        run: |
          config="${APP}/config.yaml"
          if [[ ! -f "${config}" ]]; then
            echo "::error::${config} not found"
            exit 1
          fi
          image="$(yq -r '.image // ""' "${config}")"
          if [[ -z "${image}" || "${image}" == *"{arch}"* || "${image}" == *:* ]]; then
            echo "::error::${config}: image must be a multi-arch name without a tag or {arch}, e.g. ghcr.io/owner/my-app"
            exit 1
          fi
          {
            echo "version=$(yq -r '.version' "${config}")"
            echo "name=$(yq -r '.name' "${config}")"
            echo "description=$(yq -r '.description' "${config}")"
            echo "url=$(yq -r '.url // ""' "${config}")"
            echo "architectures=$(yq -o=json -I=0 '.arch' "${config}")"
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        if: inputs.publish
        env:
          IMAGE: ${{ steps.info.outputs.registry_prefix }}/${{ steps.info.outputs.image_name }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          ref="${IMAGE}:${VERSION}"
          if result="$(docker buildx imagetools inspect "${ref}" 2>&1)"; then
            echo "::error::${ref} already exists. Bump the version instead of rebuilding it."
            exit 1
          fi
          if [[ "${result}" != *"not found"* && "${result}" != *"MANIFEST_UNKNOWN"* && "${result}" != *"manifest unknown"* ]]; then
            printf '%s\n' "${result}" >&2
            echo "::error::Could not check whether ${ref} exists"
            exit 1
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Build ${{ inputs.app }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: ${{ inputs.app }}-${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ inputs.app }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish ${{ inputs.app }} manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
